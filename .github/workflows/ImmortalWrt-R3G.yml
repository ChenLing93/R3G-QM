name: Build ImmortalWrt for Xiaomi R3G

on:
  # 手动触发：可以在输入框里自定义 Release 标签
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 标签（留空自动生成 v24.10-YYYYMMDD-r<运行编号>）'
        required: false
        default: ''
  # 推送 v 开头的标签时自动编译并发布
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

# 同一分支/标签只跑一个，新的顶掉排队的
concurrency:
  group: build-r3g-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_REPO: https://github.com/immortalwrt/immortalwrt.git
  SRC_BRANCH: openwrt-24.10
  BIN_DIR: bin/targets/ramips/mt7621

jobs:
  build:
    name: 编译 R3G 固件
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      # OpenWrt 编译很吃盘，runner 默认的 14G 左右不够用
      - name: 清理 runner 磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: ccache 缓存（重编译时省时间）
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: r3g-ramips-mt7621
          max-size: 2G

      - name: 克隆 ImmortalWrt 源码
        run: git clone --depth=1 -b "$SRC_BRANCH" "$SRC_REPO" immortalwrt

      # 必须在 feeds update 之前跑：diy.sh 要往 feeds.conf.default 里加 QModem feed
      - name: 执行 DIY 脚本（feed / 主题 / 默认 IP 与主机名）
        run: |
          chmod +x diy.sh
          ./diy.sh

      - name: 更新并安装 feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 载入 .config 并生成完整配置
        run: |
          cp -f .config immortalwrt/.config
          cd immortalwrt
          make defconfig

      # defconfig 会把源码/feed 里不存在的配置项静默丢掉，这里把丢弃项列出来，
      # 并对关键包做硬校验：少一个就直接失败，不产残废固件。
      - name: 校验关键软件包
        run: |
          cd immortalwrt

          REQUIRED="
          CONFIG_PACKAGE_luci-theme-aurora
          CONFIG_PACKAGE_luci-app-qmodem-next
          CONFIG_PACKAGE_luci-app-upnp
          CONFIG_PACKAGE_luci-app-wechatpush
          CONFIG_PACKAGE_luci-app-sms-tool-js
          CONFIG_PACKAGE_sms-tool
          CONFIG_PACKAGE_gammu
          CONFIG_PACKAGE_uqmi
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim
          CONFIG_PACKAGE_kmod-usb-net-rndis
          CONFIG_PACKAGE_kmod-usb-serial-option
          CONFIG_PACKAGE_kmod-usb-serial-wwan
          "

          MISSING=""
          for s in $REQUIRED; do
            grep -q "^${s}=y$" .config || MISSING="${MISSING} ${s}"
          done

          grep -oE '^CONFIG_[A-Za-z0-9_]+=y' ../.config | sort > /tmp/want.txt || true
          grep -oE '^CONFIG_[A-Za-z0-9_]+=y' .config | sort > /tmp/got.txt || true
          comm -23 /tmp/want.txt /tmp/got.txt > /tmp/dropped.txt || true

          {
            echo "## 配置校验"
            echo ""
            echo "仓库 .config 里被 defconfig 丢弃的 =y 项（源码/feed 里没有对应包）："
            echo '```'
            cat /tmp/dropped.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$MISSING" ]; then
            echo "::error::这些关键包没有被选中:${MISSING}"
            echo "## 失败：关键包缺失" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "关键包齐全"

      - name: 下载依赖包
        run: |
          cd immortalwrt
          make download -j"$(nproc)" || make download -j1 V=s

      - name: 编译固件
        run: |
          cd immortalwrt
          make -j"$(nproc)" V=s

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            immortalwrt/logs/
            immortalwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 收集固件并生成校验和
        run: |
          mkdir -p release_assets
          BINDIR="immortalwrt/${BIN_DIR}"
          shopt -s nullglob
          bins=("$BINDIR"/*.bin)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::编译没有产出任何 .bin，看看上面的日志"
            ls -l "$BINDIR" || true
            exit 1
          fi
          cp "${bins[@]}" release_assets/
          cd release_assets
          sha256sum ./*.bin > sha256sums.txt
          ls -lh

          {
            echo "## 产物"
            echo '```'
            cat sha256sums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-R3G-${{ github.run_number }}
          path: release_assets/*
          if-no-files-found: error

      - name: 计算 Release 标签与编译时间
        id: vars
        run: |
          BUILD_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v24.10-$(TZ=Asia/Shanghai date +%Y%m%d)-r${{ github.run_number }}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          {
            echo "tag=$TAG"
            echo "build_time=$BUILD_TIME"
          } >> "$GITHUB_OUTPUT"
          echo "Release 标签: $TAG （编译时间 $BUILD_TIME 北京时间）"

      - name: 发布到 GitHub Releases
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }} · Xiaomi R3G
          files: |
            release_assets/*.bin
            release_assets/sha256sums.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            🚀 **ImmortalWrt 小米 R3G 固件（自动编译）**

            目标设备：**Xiaomi Mi Router 3G**（ramips / mt7621），源码分支 `openwrt-24.10`，Linux 6.6 内核，SquashFS 根文件系统。

            ### 📋 编译信息

            | 属性 | 值 |
            | :--- | :--- |
            | 🏷️ 标签 | `${{ steps.vars.outputs.tag }}` |
            | 📅 编译时间 | ${{ steps.vars.outputs.build_time }}（北京时间） |
            | 🌿 源码 | `immortalwrt/immortalwrt` @ `openwrt-24.10` |
            | 💾 文件系统 | SquashFS |
            | 🔧 触发方式 | ${{ github.event_name }} / 运行 #${{ github.run_number }} |

            ### 🧩 内置插件

            | 插件 | 说明 |
            | :--- | :--- |
            | 🎨 **Aurora (luci-theme-aurora)** | 现代风格的 LuCI 主题 |
            | 📶 **QModem (luci-app-qmodem-next)** | 4G/5G 模组管理：状态、锁频、SIM 切换、短信 |
            | 🔗 **UPnP** | 通用即插即用 |
            | 💬 **WeChatPush** | 微信推送（离线、掉线提醒） |
            | ✉️ **SMS Tool JS + Gammu** | 短信收发与 SIM 状态 |
            | 🔌 **USB 模组驱动** | QMI / MBIM / NCM / RNDIS + option/wwan 串口 |

            ### 📥 刷机说明

            | 文件名 | 用途 |
            | :--- | :--- |
            | `*squashfs-sysupgrade.bin` | 已在跑 ImmortalWrt/OpenWrt 时，系统内升级 |
            | `*squashfs-factory.bin` | 从原厂固件 / 救砖模式刷入（R3G 走 breed 或 SSH 刷入） |
            | `sha256sums.txt` | 校验和，刷前先对一遍 |

            > ⚠️ 刷机前请备份原厂固件与 EEPROM；首次启动需要 1–3 分钟。
            > 默认 LAN：`192.168.10.1`，主机名 `5G-QModem`，默认无密码，登录后请立即修改。

            ---
            *由 GitHub Actions 自动构建。*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
